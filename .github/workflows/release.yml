name: release

# A tag is the only thing that publishes, and now that is true by
# construction rather than by configuration.
#
# Hosting is GitHub Pages, deployed from here. Nothing watches the repository,
# so a push cannot publish and a deployment exists only because this workflow
# ran. The previous host was Cloudflare Pages and is gone; it also never
# answered ranged reads, which is what made installing the add-on zip crash
# Kodi on Android while the tiny repository zip installed fine.
#
# `repo/` is built here, three steps up, and uploaded directly - so what is
# published is the build of the commit being released rather than a folder
# somebody remembered to commit.
#
# The last step polls the live index because the add-on's whole update story
# rests on that one file being right, and nothing used to check it. A green
# build that published nothing is the failure this catches.

on:
  push:
    tags: ["v*"]
  # For re-firing a publish that failed after the release was created.
  workflow_dispatch:

permissions:
  contents: write        # gh release create
  pages: write           # deploy-pages
  id-token: write        # deploy-pages authenticates over OIDC, not a secret

# One Pages site, so two releases publishing at once would race for it. Not
# cancel-in-progress: the loser would be a half-published repository.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 3.8, because that is what Kodi 21 ships. Pinned runner: 3.8 is past end
      # of life and the 24.04 image has no build of it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: pytest
        run: python -m pip install --disable-pip-version-check pytest

      # A release that fails its own checks is the one failure that reaches a
      # television, so this runs before anything is published.
      - name: the whole suite
        run: python -m pytest tests -q

      - name: build the repository
        run: |
          python tools/build.py --check
          python tools/build.py

      # A tag pointing at a commit whose addon.xml says something else would
      # publish one version under another version's name.
      # One release is one number. The tag, both manifests, the changelog and
      # the README all have to say it, or something downstream reads a version
      # that was never published.
      - name: the tag is the version, everywhere
        run: |
          python - <<'PY'
          import os, re, sys, xml.etree.ElementTree as ET

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          wrong = []
          for addon in ("plugin.video.katan", "repository.katan"):
              got = ET.parse(addon + "/addon.xml").getroot().get("version")
              if got != tag:
                  wrong.append("%s/addon.xml says %s" % (addon, got))

          news = ET.parse("plugin.video.katan/addon.xml").find(".//news")
          first = (news.text or "").strip().splitlines()[0].strip() if news is not None else ""
          if first != "v" + tag:
              wrong.append("the changelog opens with %r" % first)

          readme = open("README.md", encoding="utf-8").read()
          linked = set(re.findall(r"repository\.katan-(\d+\.\d+\.\d+)\.zip", readme))
          if linked - {tag}:
              wrong.append("the README links to %s" % sorted(linked))

          if wrong:
              sys.exit("releasing v%s but: %s" % (tag, "; ".join(wrong)))
          print("releasing %s, and everything agrees" % tag)
          PY

      # The list of releases somebody actually reads, with the zips attached as
      # a second copy. `gh` is on the runner already, so no action is added.
      - name: the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > notes.md
          import xml.etree.ElementTree as ET
          news = ET.parse("plugin.video.katan/addon.xml").find(
              ".//news")
          print((news.text or "").strip() if news is not None else "")
          PY
          # addons.xml and its checksum are attached too, because the add-on's
          # own update check reads them from
          # /releases/latest/download/addons.xml - a stable alias for whichever
          # release is newest. Without them here that URL is a 404 and no
          # device is ever told there is a new version.
          gh release create "$GITHUB_REF_NAME" \
            repo/zips/plugin.video.katan/*.zip \
            repo/zips/repository.katan/*.zip \
            repo/addons.xml repo/addons.xml.md5 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      # GitHub Pages, which is where the rest of the Kodi world already hosts.
      #
      # The previous host did not answer **ranged reads**: every `Range`
      # request came back 200 with the whole file. Kodi does not stream a zip
      # front to back - it reads the central directory at the end and then
      # seeks to each member - so a 123-member add-on meant a 475 KB download
      # per seek on a television, while the 2-member repository zip was small
      # enough not to care. That is precisely the split that was reported: the
      # repository installed and the add-on took Kodi down with it. Measured
      # on The Crew and Fishenzon, GitHub answers 206 with Accept-Ranges on a
      # 2.9 MB zip.
      #
      # `repo/` is uploaded as the site root, so the URLs baked into
      # repository.katan need no path juggling.
      - name: upload the built repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: publish to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      # The only automated proof a release reached the devices. Everything
      # above can pass while the site still serves the previous version.
      - name: the site is serving it
        run: |
          python - <<'PY'
          import os, sys, time, urllib.request, xml.etree.ElementTree as ET

          INDEX = "https://noflevi.github.io/kodi/addons.xml"
          want = os.environ["GITHUB_REF_NAME"].lstrip("v")
          deadline = time.time() + 300           # a Pages build is ~1 minute

          seen = "nothing yet"
          while time.time() < deadline:
              time.sleep(15)
              try:
                  # A bare urllib request to this CDN is answered 403 without
                  # a User-Agent, which is what tools/e2e.py found too.
                  request = urllib.request.Request(
                      INDEX, headers={"User-Agent": "katan-release"})
                  body = urllib.request.urlopen(request, timeout=20).read()
                  root = ET.fromstring(body)
                  node = root.find("./addon[@id='plugin.video.katan']")
                  seen = node.get("version") if node is not None else "no addon"
              except Exception as error:
                  seen = "%s: %s" % (type(error).__name__, error)
                  continue
              if seen == want:
                  print("GitHub Pages is serving %s" % want)
                  break
              print("still %s, waiting for %s" % (seen, want))
          else:
              sys.exit("the site never served %s (last saw %s)"
                       % (want, seen))

          # The index saying 0.0.3 and the zip beside it being 0.0.2 is a
          # release nobody could install and every check above would pass.
          # An upload is many files and any one of them can be the stale one,
          # so compare the bytes rather than the name.
          import hashlib

          name = "plugin.video.katan-%s.zip" % want
          local = os.path.join("repo", "zips", "plugin.video.katan", name)
          mine = hashlib.md5(open(local, "rb").read()).hexdigest()

          request = urllib.request.Request(
              "https://noflevi.github.io/kodi/zips/plugin.video.katan/" + name,
              headers={"User-Agent": "katan-release"})
          published = urllib.request.urlopen(request, timeout=60).read()
          theirs = hashlib.md5(published).hexdigest()

          if not published.startswith(b"PK"):
              sys.exit("the published %s is not a zip" % name)
          if mine != theirs:
              sys.exit("%s differs: built %s, published %s"
                       % (name, mine, theirs))
          print("%s is byte for byte what this release built (%s, %d KB)"
                % (name, mine, len(published) / 1024))
          PY
