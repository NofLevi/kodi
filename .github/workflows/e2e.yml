name: end to end

# This add-on runs on three very different machines: a Windows PC, a BYINTEK
# LOVE U4 projector on Android 9, and a Mi Box. The Python is identical on all
# three - `<platform>all</platform>`, no compiled anything - so what differs is
# never the logic. It is the ground underneath it: the filesystem, the path
# rules, the text encoding.
#
# Windows forbids characters Android allows and compares filenames without
# case. Android is case sensitive and allows nearly anything. A subtitle
# written under one name and read back under another works on one and not the
# other, and the symptom is a subtitle that silently never appears. A run on
# one operating system says nothing about the other, so every check that can
# differ runs on both.
#
# What no runner can prove is the part that is about the hardware: hardware
# HEVC decode, a gigabyte of RAM shared with Android, and slow eMMC storage.
# Tools -> Device report measures those on whatever box it runs on, and
# `tools/deploy_android.py` puts the add-on there over adb. That is the step
# that has to be done by hand, and it is the one still outstanding.

# **Not on push.** Two workflows firing on every commit meant a run for every
# small change, and these are the slow ones - the live job asks a dozen
# third-party services and the upgrade job downloads a real release. That is
# noise on a branch where the interesting question is asked once, before a
# release.
#
# What is left is the daily cron, which is the whole reason this file exists -
# it watches for *drift*, and drift happens on somebody else's schedule, not on
# ours - and the button, for when somebody wants an answer now. `release.yml`
# runs the full suite itself before it publishes, so a release is still gated.
on:
  schedule:
    # Every morning. The live services are what drifts, and drift is only
    # visible if something looks.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------
  # Everything that can differ between a PC and a television box, on both.
  # --------------------------------------------------------------------
  platforms:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not cancel the other. Knowing it is broken
      # on Windows *and fine on Linux* is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            # A Windows console is cp1252 unless told otherwise, and the
            # catalogue is half Hebrew. Without this the tools raise
            # UnicodeEncodeError printing a title, which is a property of the
            # console rather than of the add-on - twice mistaken for a bug.
            encoding: "1"
          - os: ubuntu-22.04
            label: linux (stands in for Android)
            encoding: "0"

    steps:
      - uses: actions/checkout@v4

      # 3.8, because that is what Kodi 21 ships on every one of these boxes.
      # Testing on anything newer lets syntax through that Kodi reports as a
      # blank screen. It is also why the runner is pinned: 3.8 is past end of
      # life and the 24.04 image `ubuntu-latest` now points at has no build of
      # it, so setup-python fails before a single test runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # The only thing outside the standard library. The add-on itself has no
      # required dependencies at all - that is deliberate and enforced by a
      # test - so this is the test runner and nothing else.
      - name: pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: the whole suite
        run: python -m pytest tests -q

      - name: the manifests and the zips
        run: |
          python tools/build.py --check
          python tools/build.py

      # The zip has to be built first: one of these opens it and checks no
      # member carries a backslash or collides with another under case
      # folding, both of which unpack differently on Android than on Windows.
      - name: filesystem, paths and encoding
        env:
          PYTHONUTF8: ${{ matrix.encoding }}
        run: python tools/e2e.py --offline --json e2e-offline.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.label }}
          path: e2e-offline.json

  # --------------------------------------------------------------------
  # The live services, once. They do not vary by operating system, and
  # asking somebody else's API the same question twice is rude.
  # --------------------------------------------------------------------
  live:
    name: against the live services
    runs-on: ubuntu-22.04
    # A service having a bad day must not turn the repository red, or the red
    # stops meaning anything. The report is still written either way.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # `repo/` is not in the repository - Cloudflare builds it - and one
      # offline check opens the built zip to prove no member name breaks on
      # Android. Without this it fails for want of a file rather than for a
      # defect, which is the red build nobody can fix.
      - name: build the repository
        run: python tools/build.py

      - name: end to end
        run: python tools/e2e.py --json e2e.json

      - name: what it found
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import io, json, os
          if not os.path.isfile("e2e.json"):
              print("The end-to-end run produced no report at all.")
              raise SystemExit
          rows = json.load(io.open("e2e.json", encoding="utf-8"))
          ok = [r for r in rows if r["status"] == "ok"]
          bad = [r for r in rows if r["status"] == "failed"]
          print("## End to end: %d of %d checks passed\n" % (len(ok), len(rows)))
          if bad:
              print("| | check | area | what happened |")
              print("|---|---|---|---|")
              for r in bad:
                  print("| %s | %s | %s | %s |"
                        % ("**blocking**" if r["required"] else "outage?",
                           r["name"], r["area"], r["detail"][:160]))
              print("")
          print("<details><summary>everything that passed</summary>\n")
          print("| check | area | took |")
          print("|---|---|---|")
          for r in ok:
              print("| %s | %s | %d ms |" % (r["name"], r["area"], r["ms"]))
          print("\n</details>")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e.json
